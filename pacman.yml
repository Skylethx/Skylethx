name: Generate Pac-Man contribution graph

on:
  schedule: # Se ejecuta cada 12 horas
    - cron: "0 */12 * * *"

  workflow_dispatch: # Permite ejecutarlo a mano desde la pestaña Actions

  push:
    branches:
      - main # Cambia a "master" si tu rama principal se llama así

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Pac-Man SVGs
        uses: abozanona/pacman-contribution-graph@main
        with:
          github_user_name: ${{ github.repository_owner }}

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
